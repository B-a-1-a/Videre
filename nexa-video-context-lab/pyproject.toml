[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-video-context-lab"
version = "0.1.0"
description = "Standalone Nexa VLM video context + timestamp section tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nexaai"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nexa-video-context = "nexa_video_context_lab.video_context:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
