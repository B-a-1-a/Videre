[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-caption-lab"
version = "0.1.0"
description = "Standalone Nexa SDK video captioning playground."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nexaai"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
local = ["faster-whisper"]
qai = ["qai-hub-models[whisper-small]"]
npu = ["onnxruntime-qnn", "transformers"]

[project.scripts]
nexa-caption = "nexa_caption_lab.caption_video:main"
nexa-caption-local = "nexa_caption_lab.whisper_local:main"
nexa-caption-qai = "nexa_caption_lab.whisper_qai:main"
nexa-caption-npu = "nexa_caption_lab.whisper_npu:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
